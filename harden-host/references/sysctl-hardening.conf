# /etc/sysctl.d/90-hardening.conf — kernel & network hardening baseline (harden-host)
#
# Apply:  sysctl --system     Verify: harden-audit SYSCTL section, or sysctl <key>
# FORMAT: sysctl.d does NOT support trailing comments ("key = 1  # x" writes "1  # x" to the
# kernel; string values then fail). Every comment below is on its own line — keep it that way.
# Each setting states its COST. [WORKLOAD] items must be decided per host, not copied.
# Values are for Linux >= 6.1; unknown keys only log a warning.

########## Kernel information leaks (cheap, safe everywhere)
# Hide kernel pointers even from root without CAP_SYSLOG. Cost: perf/bpftrace symbols for non-root.
kernel.kptr_restrict = 2
# dmesg needs CAP_SYSLOG.
kernel.dmesg_restrict = 1
# Debian/Ubuntu patch: 3 = perf only with CAP_PERFMON (upstream max is 2). Cost: unprivileged profiling.
kernel.perf_event_paranoid = 3
# No core dumps of setuid processes (credential leaks).
fs.suid_dumpable = 0

########## Exploit mitigation (cheap)
# Full ASLR (the default; make sure nobody lowered it).
kernel.randomize_va_space = 2
# ptrace attach only with CAP_SYS_PTRACE. Cost: gdb/strace -p as a normal user. Use 1 on dev boxes.
kernel.yama.ptrace_scope = 2
# 1 = locked until reboot (2 = an admin may re-enable). Cost: unprivileged BPF tools.
kernel.unprivileged_bpf_disabled = 1
# Constant blinding for all JIT'd BPF. Cost: small BPF performance hit.
net.core.bpf_jit_harden = 2
# One-way: no kexec until reboot. Cost: kdump and kexec-based reboots. Skip if you use kdump.
kernel.kexec_load_disabled = 1
# No auto-loading of TTY line disciplines (a historic CVE source).
dev.tty.ldisc_autoload = 0
# Linux 6.2+: block TIOCSTI keystroke injection into other terminals.
dev.tty.legacy_tiocsti = 0
# userfaultfd only for privileged users (used to win kernel races); default 0 since 5.11.
vm.unprivileged_userfaultfd = 0
# Link/symlink protections in sticky world-writable dirs (defaults on systemd distros; ensure them).
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# Block O_CREAT on other users' FIFOs/regular files in sticky dirs (/tmp spoofing).
fs.protected_fifos = 2
fs.protected_regular = 2
# [WORKLOAD] 0 = no magic SysRq. Keep a safe mask (e.g. 176) if you rely on the provider console
# for emergency sync/remount/reboot.
kernel.sysrq = 0

########## [WORKLOAD] Attack-surface switches — decide, don't copy
# io_uring: large kernel attack surface (many LPEs 2022-2025). Few server apps need it
# (PostgreSQL 18 io_method=io_uring is opt-in; default is 'worker'). 2 = disabled for everyone.
#kernel.io_uring_disabled = 2
# Unprivileged user namespaces: needed by rootless Docker/Podman, browsers, some sandboxes and
# systemd PrivateUsers=. On Ubuntu >= 23.10 prefer the AppArmor gate (default 1 already):
#kernel.apparmor_restrict_unprivileged_userns = 1
# Hard-disable only if nothing needs them (breaks rootless containers):
#user.max_user_namespaces = 0
# Load all required modules first (overlay, br_netfilter, nf_*, wireguard ...), then lock.
# One-way until reboot; set it from a late boot unit rather than here.
#kernel.modules_disabled = 1

########## Network: IPv4
# SYN-flood resilience.
net.ipv4.tcp_syncookies = 1
# Drop RST for TIME_WAIT sockets (TIME_WAIT assassination).
net.ipv4.tcp_rfc1337 = 1
# ICMP redirects = route hijacking on a shared L2 (common on VPS networks).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
# Not a router.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
# [WORKLOAD] Strict reverse-path filtering. Use 2 (loose) when multi-homed or with asymmetric/policy
# routing (WireGuard full tunnel, several uplinks).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Useful signal, but noisy on some provider networks:
#net.ipv4.conf.all.log_martians = 1
# net.ipv4.ip_forward: leave to Docker/libvirt/WireGuard if they need it; otherwise keep 0.
# Docker's nftables backend (29+) will NOT enable it itself: set it explicitly there.

########## Network: IPv6
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# [WORKLOAD] Router Advertisements: many VPS providers configure IPv6 via SLAAC/RA; accept_ra = 0
# silently kills IPv6 there. Only disable with static IPv6:
#net.ipv6.conf.all.accept_ra = 0
#net.ipv6.conf.default.accept_ra = 0
# Do NOT "harden" by disabling IPv6 (disable_ipv6 = 1): it breaks software binding ::1, and the
# real fix for IPv6 exposure is an IPv6 firewall at parity with IPv4.

########## Efficiency (no security cost; optional)
#net.core.default_qdisc = fq
# needs the tcp_bbr module:
#net.ipv4.tcp_congestion_control = bbr
# With zram swap, 100+ is fine instead:
#vm.swappiness = 10
# A full conntrack table drops NEW connections (= outage under scan floods). ~300 bytes per entry;
# watch conntrack -S and dmesg "table full".
#net.netfilter.nf_conntrack_max = 262144
