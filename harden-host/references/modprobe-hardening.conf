# /etc/modprobe.d/90-hardening.conf — block loading of rarely used, bug-prone kernel modules.
#
# "install X /bin/false" blocks loading entirely (including an explicit modprobe);
# "blacklist X" only stops alias-based auto-loading. Unprivileged users can trigger
# auto-loading of protocol modules just by opening a socket of that family, which is
# exactly how many LPE exploits pull a buggy module into the kernel.
#
# Before applying: lsmod | grep -E '<names>' — if something is loaded, find out why.
# After: update-initramfs -u (Debian/Ubuntu) or dracut -f (RHEL) so early boot agrees.
# Comments are on their own lines on purpose (keep the config format unambiguous).

# --- Network protocols almost no server uses (several are already gone upstream; harmless if absent)
install dccp /bin/false
# [WORKLOAD] keep SCTP for SIP/telecom/WebRTC SFUs that need it
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n_hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false
install ieee802154 /bin/false

# --- Filesystems not used on servers (USB sticks, old Macs, optical media)
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
# [WORKLOAD] Azure delivers provisioning data (ovf-env.xml) on a UDF-formatted virtual DVD:
# keep udf on Azure VMs (CIS exempts it there too).
install udf /bin/false
# NOT squashfs: snapd and some appliance images need it.

# --- Physical attack surface; pointless on a VPS/VM, decide on bare metal
# [WORKLOAD] bare metal with USB backup drives: keep usb-storage
install usb-storage /bin/false
install firewire-core /bin/false
install thunderbolt /bin/false
install bluetooth /bin/false
install btusb /bin/false

# --- Rarely needed, historically buggy
# [WORKLOAD] keep cifs / nfs if you mount SMB / NFS shares
install cifs /bin/false
install nfs /bin/false
# vivid: test video driver with an LPE history
install vivid /bin/false
