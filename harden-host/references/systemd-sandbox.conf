# systemd service sandbox template (harden-host)
#
# Install as a drop-in, never by editing the vendor unit:
#   systemctl edit <unit>            # writes /etc/systemd/system/<unit>.d/override.conf
#   systemctl daemon-reload && systemctl restart <unit> && systemctl status <unit>
#   systemd-analyze security <unit>  # exposure score: aim for < 4 ("OK") on internet-facing units
#
# FORMAT: systemd has NO trailing comments. "ProtectProc=invisible  # x" is rejected and the
# setting is silently ignored. Every comment here is on its own line — keep it that way, and
# check with: systemd-analyze verify <unit>   (it reports "Failed to parse ..., ignoring").
#
# Work iteratively: add a block, restart, exercise the service, then watch
#   journalctl -u <unit> -f      (EPERM / EACCES / "Read-only file system" = a line to relax)
# This is the cheapest strong isolation Linux offers: no daemon, no image, ~zero runtime cost,
# enforced by namespaces/seccomp/cgroups the kernel already has.

[Service]
# --- Identity: never root unless it must bind/own something privileged
User=svc-myapp
Group=svc-myapp
# Alternative: transient UID; implies ProtectSystem=strict, PrivateTmp, RemoveIPC ...;
# keep state via StateDirectory=.
#DynamicUser=yes
NoNewPrivileges=yes
UMask=0077

# --- Capabilities: start from none; add back only what the binary needs.
CapabilityBoundingSet=
AmbientCapabilities=
# For ports < 1024 (better: listen on 8080 behind the proxy). NOTE: incompatible with
# PrivateUsers=yes below — capabilities then only exist inside the service's user namespace,
# so drop PrivateUsers if you add any capability.
#CapabilityBoundingSet=CAP_NET_BIND_SERVICE
#AmbientCapabilities=CAP_NET_BIND_SERVICE

# --- Filesystem: whole OS read-only, home invisible, private /tmp and /dev
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
# Writable dirs owned by the service user (relative names: /var/lib/myapp, /var/log/myapp,
# /run/myapp; the runtime dir is removed on stop).
StateDirectory=myapp
LogsDirectory=myapp
RuntimeDirectory=myapp
#ReadWritePaths=/srv/myapp/uploads
#ReadOnlyPaths=/etc/myapp
#InaccessiblePaths=/etc/ssh /root
#TemporaryFileSystem=/var:ro

# --- Kernel & system interfaces
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Other users' processes hidden in /proc:
ProtectProc=invisible
# No /proc/sys, /proc/kcore etc. Breaks apps reading /proc/meminfo or /proc/cpuinfo: then drop it.
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
# Breaks services that must chown, use real users' supplementary groups, or hold capabilities.
PrivateUsers=yes
KeyringMode=private

# --- Memory: W^X. Breaks JITs (Node/V8, Java, .NET, LuaJIT, PCRE-JIT, some Python wheels): drop for those.
MemoryDenyWriteExecute=yes

# --- System calls
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @mount @debug @cpu-emulation @obsolete @raw-io @reboot @swap @module @clock
SystemCallErrorNumber=EPERM

# --- Network: only the families the service uses (add AF_NETLINK for apps that list interfaces)
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# Per-service egress allow-list via cgroup BPF (no firewall daemon). Example: localhost and the
# private DB subnet only; name resolution then goes via the local resolver.
#IPAddressDeny=any
#IPAddressAllow=localhost 10.0.0.0/24
# systemd >= 249: only this bind is allowed
#SocketBindAllow=tcp:8080
#SocketBindDeny=any

# --- Containment / efficiency: a compromised or runaway service cannot starve the box
MemoryMax=512M
MemoryHigh=448M
TasksMax=256
CPUQuota=150%
LimitNOFILE=65536
#IOWeight=50
