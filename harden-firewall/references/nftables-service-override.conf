# /etc/systemd/system/nftables.service.d/override.conf — keep other tools' tables on stop/restart
# (harden-firewall)
#
# Debian/Ubuntu's nftables.service has `ExecStop=/usr/sbin/nft flush ruleset`: `systemctl
# restart|stop nftables` then wipes Docker/libvirt/Tailscale/fail2ban tables too, even when
# /etc/nftables.conf itself never flushes. Remove only the tables this suite owns instead.
# RHEL/Fedora: check `systemctl cat nftables`; if ExecReload/ExecStop contain "flush ruleset",
# override them the same way (ExecReload= then ExecReload=/usr/sbin/nft -f /etc/sysconfig/nftables.conf).
# Install: systemctl edit nftables (paste), or copy here + systemctl daemon-reload
[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet host_fw
ExecStop=-/usr/sbin/nft delete table inet docker_guard
