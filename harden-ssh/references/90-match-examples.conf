# /etc/ssh/sshd_config.d/90-match.conf — per-user/per-source exceptions (harden-ssh)
#
# Keep Match blocks in their own late drop-in. Recent OpenSSH scopes a Match block to the
# file it appears in, but verify on YOUR version that nothing after it is captured:
#   sshd -t && sshd -T -C user=<matched>,host=x,addr=<ip> | grep -i forwarding
#             sshd -T -C user=<other>,host=x,addr=<ip>   | grep -i forwarding
# Remember: values set in 00-hardening.conf for keywords NOT allowed in Match still win;
# inside Match, the first value for a keyword within the matching blocks wins.
# The global `AllowGroups ssh-users` from 00-hardening.conf applies to these accounts too:
# the `tunnel` user and members of `sftp-only` can only log in if they are ALSO in ssh-users,
# or if their groups are added to that line (e.g. `AllowGroups ssh-users sftp-only tunnel-users`).
# Check: sshd -T -C user=tunnel,host=x,addr=<ip> | grep -i allowgroups

# A tunnel-only account: may forward to one internal service, nothing else (no shell, no pty).
Match User tunnel
	DisableForwarding no
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:5432
	X11Forwarding no
	AllowAgentForwarding no
	PermitTTY no
	ForceCommand /usr/sbin/nologin

# SFTP-only group, chrooted (the chroot dir must be root-owned and not group/world-writable).
Match Group sftp-only
	ChrootDirectory /srv/sftp/%u
	ForceCommand internal-sftp -l INFO
	PermitTTY no
	DisableForwarding yes

# Admins from the VPN/bastion range may use agent forwarding (prefer ProxyJump instead).
#Match Group ssh-users Address 10.8.0.0/24
#	AllowAgentForwarding yes
