# /etc/ssh/sshd_config.d/00-hardening.conf — sshd hardening drop-in (harden-ssh)
#
# WHY "00-": for most keywords sshd uses the FIRST value it reads. Debian/Ubuntu/Fedora
# sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`, so files sort in, and a
# low prefix beats cloud-init's 50-cloud-init.conf (often "PasswordAuthentication yes")
# and anything later in the main file. Verify the EFFECTIVE result, never the file:
#   sshd -t                                   # syntax + semantic check (must print nothing)
#   sshd -T | grep -Ei '^(passwordauth|kbdinter|permitroot|authenticationmethods|allowgroups|kexalg|ciphers|macs)'
#   sshd -T -C user=alice,host=x,addr=203.0.113.9   # effective config for a specific connection (Match blocks)
#
# Validated with OpenSSH 10.2 (Ubuntu) and 10.3 (Alpine/musl). Lines marked [>=X.Y] need that version:
# check `ssh -V`; on older builds remove them (sshd -t names the offending line).
# Comments are on their own lines on purpose: old sshd versions reject trailing comments.
#
# LOCKOUT TRAP: create the group and add every admin BEFORE reloading:
#   groupadd -f ssh-users && usermod -aG ssh-users <admin>     (then re-login to verify)

# ---------------- Who may log in, and how
PermitRootLogin no
AllowGroups ssh-users
# Keys only. Removing the password path removes whole bug classes, e.g. "sshhole" (Nov 2026):
# musl/no-PAM sshd < 10.6p2 accepted any 257-1024 char password for accounts whose hash is "*".
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
# RHEL/Fedora's 50-redhat.conf enables GSSAPI; this wins. Builds without GSSAPI (Alpine) print a
# harmless "Unsupported option" warning: delete the line there.
GSSAPIAuthentication no
# UsePAM stays as the distro sets it (yes): PAM account/session modules (limits, loginuid,
# keyinit) still run; with the lines above, PAM can no longer be used to authenticate.
AuthorizedKeysFile .ssh/authorized_keys
# Fleet/high-value option — root-managed keys; users (and attackers with their shell) can't add keys:
#AuthorizedKeysFile /etc/ssh/authorized_keys/%u
# [>=9.1] reject small RSA user/host keys
RequiredRSASize 3072
# require FIDO2 PIN/biometric for sk-* keys (touch is required by default)
#PubkeyAuthOptions verify-required

# ---------------- Brute force & resource exhaustion (kernel/sshd-native; no fail2ban needed for SSH)
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60
MaxSessions 4
# PerSourcePenalties is ON by default since OpenSSH 9.8 (crash:90 authfail:5 noauth:1 ... max:600).
# Tighten for public SSH, and exempt your monitoring/bastion addresses:
# [>=9.8]
#PerSourcePenalties authfail:30 noauth:5 max:3600
# [>=9.8]
#PerSourcePenaltyExemptList 192.0.2.10

# ---------------- Features attackers love; re-enable per user/group in a Match block
# X11, agent, TCP and unix-socket forwarding in one switch
DisableForwarding yes
PermitTunnel no
PermitUserEnvironment no
# no ~/.ssh/rc execution (a quiet persistence point)
PermitUserRC no
Compression no
ClientAliveInterval 300
ClientAliveCountMax 2
# logs the key fingerprint used for each login (forensics)
LogLevel VERBOSE
StrictModes yes

# ---------------- Crypto
# Modern OpenSSH defaults are strong and get better over time (post-quantum mlkem768x25519-sha256
# is the default KEX since 10.0; sntrup761x25519 since 9.0). So REMOVE legacy algorithms with the
# "-" prefix instead of hard-coding a list: you keep future defaults and can't name an algorithm
# your build lacks.
# NIST-curve ECDH removal is optional hygiene (ssh-audit flags it); check that every client
# (embedded/Android/hardware-token tools) still negotiates: ssh -vv host 2>&1 | grep 'kex: algorithm'
KexAlgorithms -ecdh-sha2-*,diffie-hellman-group14-sha256,diffie-hellman-group-exchange-sha256
Ciphers -*-ctr
MACs -hmac-sha1*,umac-64*,hmac-sha2-256,hmac-sha2-512,umac-128@openssh.com
# Serve only these host keys (generate missing ones: ssh-keygen -A; drop ECDSA/DSA files).
HostKey /etc/ssh/ssh_host_ed25519_key
# keep for old clients; must be >= 3072 bits
HostKey /etc/ssh/ssh_host_rsa_key
# If you keep diffie-hellman-group-exchange-*, also filter weak moduli:
#   awk '$5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.safe && mv /etc/ssh/moduli.safe /etc/ssh/moduli
